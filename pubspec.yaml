name: wildkaki
description: An offline outing app where every outing reveals one wild animal.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  health: ^13.3.2
  shared_preferences: ^2.5.6
  flutter_svg: ^2.3.2
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/sprites/
    - assets/icons/
    - assets/sounds/
  fonts:
    - family: Tiny5
      fonts:
        - asset: assets/fonts/tiny5.ttf
